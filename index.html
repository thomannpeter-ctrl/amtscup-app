<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Amtscup – Cup-Duell</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0;color:#111827}
.container{max-width:1200px;margin:auto;padding:1rem}
h1{color:#1e3a8a}
h2{color:#1d4ed8;margin:.5rem 0}
.card{background:#fff;border-radius:14px;padding:1rem 1.25rem;
box-shadow:0 4px 10px rgba(15,23,42,.08);margin-bottom:1rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.field{flex:1;min-width:220px}
label{font-size:.8rem;font-weight:600}
input,select{width:100%;padding:.45rem;border-radius:8px;border:1px solid #cbd5f5}
.input-year{max-width:80px}
.input-result{max-width:70px}
th.gear,td.gear{width:110px}
th.zcol,td.zcol{width:65px}
th.sex,td.sex{width:70px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border:1px solid #e5e7eb;padding:.4rem;text-align:center}
th{background:#dbeafe}
button{border:none;border-radius:999px;padding:.9rem;font-size:1rem;cursor:pointer;background:#2563eb;color:white;width:100%}
.winner{padding:.7rem;border-radius:12px;font-weight:700}
.winner-ok{background:#dcfce7;color:#166534}
.winner-none{background:#e5e7eb;color:#374151}
</style>
</head>

<body>
<div class="container">

<h1>Amtscup – Cup-Duell</h1>

<div class="card">
<h2>1. Gruppenchef</h2>
<div class="row">
  <div class="field"><label>Name</label><input id="chef"></div>
  <div class="field"><label>E-Mail</label><input id="email" type="email"></div>
</div>
</div>

<div class="card">
<h2>2. Gruppenauswahl</h2>
<div class="row">
  <div class="field"><label>Gruppe 1 *</label><select id="g1"></select></div>
  <div class="field"><label>Gruppe 2 *</label><select id="g2"></select></div>
  <div class="field"><label>Gruppe 3</label><select id="g3"></select></div>
</div>
</div>

<div id="groups"></div>

<div class="card">
<h2>Sieger</h2>
<div id="winner" class="winner winner-none">Noch keine Resultate</div>
</div>

<div class="card">
<button id="sendBtn">📧 Mail & Google senden</button>
</div>

</div>

<script>
/* ================= KONFIG ================= */
const RESULT_EMAIL = "thomannpeter@bluewin.ch";
const GOOGLE_URL ="https://script.google.com/macros/s/AKfycby00Sh1_aXDnmjNwG6EFMPK1a6OIzSmpq9AwW-nXEd9RXgboI11TSvGA_G7Wy5Kqio5/exec";

const SPORTGERAETE=[
 {n:"",z:0},{n:"Standard",z:0},{n:"FG",z:0},
 {n:"Karabiner",z:4},{n:"57/02",z:8},{n:"57/03",z:4},
 {n:"90BK",z:4},{n:"90RK",z:4}
];
const zus=g=>(SPORTGERAETE.find(x=>x.n===g)||{z:0}).z;

/* ================= ELEMENTE ================= */
const elChef   = document.getElementById("chef");
const elEmail  = document.getElementById("email");
const elG1     = document.getElementById("g1");
const elG2     = document.getElementById("g2");
const elG3     = document.getElementById("g3");
const elGroups = document.getElementById("groups");
const elWinner = document.getElementById("winner");
document.getElementById("sendBtn").onclick = sendAll;

/* ================= Gruppen laden ================= */
async function loadGroups(){
  const r = await fetch("gruppen.txt?ts=" + Date.now());
  const list = (await r.text()).split(/\r?\n/).filter(x=>x.trim());

  [elG1, elG2, elG3].forEach(sel=>{
    sel.innerHTML = "<option value=''>Bitte wählen…</option>";
    list.forEach(g=>{
      const o=document.createElement("option");
      o.value=o.textContent=g;
      sel.appendChild(o);
    });
    sel.addEventListener("change", buildGroups);
  });
}

/* ================= Gruppen anzeigen ================= */
function buildGroups(){
  [1,2,3].forEach(n=>{
    const name = n===1 ? elG1.value : n===2 ? elG2.value : elG3.value;
    let card = elGroups.querySelector(`.card[data-idx="${n}"]`);

    if(!name){
      if(card) card.style.display="none";
      return;
    }

    if(!card){
      card = createGroup(n,name);
      elGroups.appendChild(card);
    }

    card.dataset.name = name;
    card.querySelector("h2").textContent = `Gruppe ${n}: ${name}`;
    card.style.display="block";
  });

  calcWinner();
}

/* ================= Gruppe erstellen ================= */
function createGroup(n,name){
  const c=document.createElement("div");
  c.className="card";
  c.dataset.idx=n;
  c.dataset.name=name;

  c.innerHTML=`<h2>Gruppe ${n}: ${name}</h2>
  <table>
  <thead><tr>
    <th>#</th><th>Name</th><th>Jahrgang</th><th class="sex">Gender</th>
    <th class="gear">Sportgerät</th><th>Resultat</th>
    <th class="zcol">Zuschlag</th><th>Total</th>
  </tr></thead>
  <tbody></tbody>
  <tfoot><tr>
    <th colspan="5">Summe</th>
    <th class="sr">0</th><th class="sz">0</th><th class="st">0</th>
  </tr></tfoot>
  </table>`;

  const tb=c.querySelector("tbody");

  for(let i=1;i<=5;i++){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i}</td>
      <td><input class="n"></td>
      <td><input class="y input-year"></td>
      <td class="sex">
        <select class="sex"><option></option><option>m</option><option>w</option></select>
      </td>
      <td class="gear"><select class="g"></select></td>
      <td><input class="r input-result"></td>
      <td class="zcol z">0</td><td class="t">0</td>`;
    SPORTGERAETE.forEach(s=>{
      const o=document.createElement("option");
      o.value=o.textContent=s.n;
      tr.querySelector(".g").appendChild(o);
    });
    tr.querySelectorAll("input,select").forEach(e=>e.oninput=()=>calc(c));
    tb.appendChild(tr);
  }
  return c;
}

/* ================= Berechnung ================= */
function calc(c){
  let sr=0,sz=0,st=0;
  c.querySelectorAll("tbody tr").forEach(tr=>{
    const r=+tr.querySelector(".r").value||0;
    const z=zus(tr.querySelector(".g").value);
    tr.querySelector(".z").textContent=z;
    tr.querySelector(".t").textContent=r+z;
    sr+=r;sz+=z;st+=r+z;
  });
  c.querySelector(".sr").textContent=sr;
  c.querySelector(".sz").textContent=sz;
  c.querySelector(".st").textContent=st;
  calcWinner();
}

/* ================= Sieger ================= */
function calcWinner(){
  const cards=[...elGroups.querySelectorAll(".card")];
  const d=cards.map(c=>({n:c.dataset.name,t:+c.querySelector(".st").textContent}))
               .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  if(!d.length){
    elWinner.textContent="Noch keine Resultate";
    elWinner.className="winner winner-none";
    return;
  }
  elWinner.className="winner winner-ok";
  elWinner.innerHTML=d.length===2
    ?`🏆 Sieger: ${d[0].n} (${d[0].t})<br>❌ Verlierer: ${d[1].n} (${d[1].t})`
    :`🏆 Sieger: ${d[0].n} (${d[0].t}) & ${d[1].n} (${d[1].t})<br>❌ Verlierer: ${d[2].n} (${d[2].t})`;
}

/* ================= Mail + Google ================= */
function sendAll(){
  let mail=`AMTSCUP CUP-DUELL\n\nGruppenchef: ${elChef.value}\nE-Mail: ${elEmail.value}\n\n`;
  const rows=[];

  elGroups.querySelectorAll(".card").forEach((c,i)=>{
    mail+=`GRUPPE ${i+1}: ${c.dataset.name}\n`;
    mail+="Name;Jahrgang;Gender;Sportgerät;Resultat;Zuschlag;Total\n";

    c.querySelectorAll("tbody tr").forEach(tr=>{
      const name=tr.querySelector(".n").value;
      const res=tr.querySelector(".r").value;
      if(!name && !res) return;

      const row={
        gruppe:c.dataset.name,
        name,
        jahr:tr.querySelector(".y").value,
        gender:tr.querySelector("select.sex").value,
        geraet:tr.querySelector(".g").value,
        resultat:res,
        zuschlag:tr.querySelector(".z").textContent,
        total:tr.querySelector(".t").textContent
      };
      rows.push(row);
      mail+=`${row.name};${row.jahr};${row.gender};${row.geraet};${row.resultat};${row.zuschlag};${row.total}\n`;
    });
    mail+="\n";
  });

  mail+="SIEGER:\n"+elWinner.textContent;

  location.href=`mailto:${RESULT_EMAIL}?subject=${encodeURIComponent("Amtscup Resultat")}&body=${encodeURIComponent(mail)}`;

  fetch(GOOGLE_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chef:elChef.value,email:elEmail.value,rows})
  });
}

loadGroups();
</script>
</body>
</html>
