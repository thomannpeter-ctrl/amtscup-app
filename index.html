<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Amtscup – Cup-Duell</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0}
.container{max-width:1200px;margin:auto;padding:1rem}
h1{color:#1e3a8a}
h2{color:#1d4ed8}
.card{background:#fff;border-radius:14px;padding:1rem;margin-bottom:1rem;
box-shadow:0 4px 10px rgba(0,0,0,.08)}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.field{flex:1;min-width:220px}
label{font-size:.8rem;font-weight:600}
input,select{width:100%;padding:.45rem;border-radius:8px;border:1px solid #cbd5f5}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border:1px solid #e5e7eb;padding:.4rem;text-align:center}
th{background:#dbeafe}
button{width:100%;padding:.9rem;border:none;border-radius:999px;
background:#2563eb;color:#fff;font-size:1rem;cursor:pointer}
.winner{padding:.7rem;border-radius:12px;font-weight:700}
.winner-ok{background:#dcfce7;color:#166534}
.winner-none{background:#e5e7eb;color:#374151}
</style>
</head>

<body>
<div class="container">

<h1>Amtscup – Cup-Duell</h1>

<div class="card">
<h2>1. Gruppenchef</h2>
<div class="row">
 <div class="field"><label>Name</label><input id="chef"></div>
 <div class="field"><label>E-Mail</label><input id="email"></div>
</div>
</div>

<div class="card">
<h2>2. Gruppenauswahl</h2>
<div class="row">
 <div class="field"><label>Gruppe 1</label><select id="g1"></select></div>
 <div class="field"><label>Gruppe 2</label><select id="g2"></select></div>
 <div class="field"><label>Gruppe 3</label><select id="g3"></select></div>
</div>
</div>

<div id="groups"></div>

<div class="card">
<h2>Sieger</h2>
<div id="winner" class="winner winner-none">Noch keine Resultate</div>
</div>

<div class="card">
<button id="sendBtn">📧 Mail & Google senden</button>
</div>

</div>

<script>
/* ================= KONFIG ================= */
const SPORTGERAETE=[
 {n:"",z:0},{n:"Standard",z:0},{n:"FG",z:0},
 {n:"Karabiner",z:4},{n:"57/02",z:8},{n:"57/03",z:4},
 {n:"90BK",z:4},{n:"90RK",z:4}
];
const zus=g=>(SPORTGERAETE.find(x=>x.n===g)||{z:0}).z;

/* ================= DOM ================= */
const groupsDiv = document.getElementById("groups");
const winnerDiv = document.getElementById("winner");
const selects = ["g1","g2","g3"].map(id=>document.getElementById(id));

/* ================= STATE ================= */
const state = {}; // key = g1|g2|g3

/* ================= LOAD GROUPS ================= */
async function loadGroups(){
 const txt = await fetch("gruppen.txt?"+Date.now()).then(r=>r.text());
 const list = txt.split(/\r?\n/).filter(Boolean);

 selects.forEach(sel=>{
  sel.innerHTML = "<option value=''>Bitte wählen…</option>";
  list.forEach(g=>{
   const o=document.createElement("option");
   o.value=o.textContent=g;
   sel.appendChild(o);
  });
  sel.addEventListener("change", render);
 });
}

/* ================= RENDER ================= */
function render(){
 saveAll();
 groupsDiv.innerHTML="";

 selects.forEach(sel=>{
  if(!sel.value) return;
  const card=createGroup(sel.id, sel.value);
  groupsDiv.appendChild(card);
  restore(card);
 });

 calcWinner();
}

/* ================= GROUP ================= */
function createGroup(key,name){
 const c=document.createElement("div");
 c.className="card";
 c.dataset.key=key;
 c.dataset.name=name;

 c.innerHTML=`<h2>${name}</h2>
 <table><thead><tr>
 <th>#</th><th>Name</th><th>Jg</th><th>G</th>
 <th>Gerät</th><th>Res</th><th>Zu</th><th>Total</th>
 </tr></thead><tbody></tbody>
 <tfoot><tr><th colspan="5">Summe</th>
 <th class="sr">0</th><th class="sz">0</th><th class="st">0</th>
 </tr></tfoot></table>`;

 const tb=c.querySelector("tbody");

 for(let i=1;i<=5;i++){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${i}</td>
   <td><input class="n"></td>
   <td><input class="y"></td>
   <td><select class="s"><option></option><option>m</option><option>w</option></select></td>
   <td><select class="g"></select></td>
   <td><input class="r"></td>
   <td class="z">0</td><td class="t">0</td>`;
  SPORTGERAETE.forEach(s=>{
   const o=document.createElement("option");
   o.value=o.textContent=s.n;
   tr.querySelector(".g").appendChild(o);
  });
  tr.querySelectorAll("input,select").forEach(e=>e.oninput=()=>calc(c));
  tb.appendChild(tr);
 }
 return c;
}

/* ================= CALC ================= */
function calc(c){
 let sr=0,sz=0,st=0;
 c.querySelectorAll("tbody tr").forEach(tr=>{
  const r=+tr.querySelector(".r").value||0;
  const z=zus(tr.querySelector(".g").value);
  tr.querySelector(".z").textContent=z;
  tr.querySelector(".t").textContent=r+z;
  sr+=r; sz+=z; st+=r+z;
 });
 c.querySelector(".sr").textContent=sr;
 c.querySelector(".sz").textContent=sz;
 c.querySelector(".st").textContent=st;
 calcWinner();
}

/* ================= WINNER ================= */
function calcWinner(){
 const d=[...groupsDiv.children]
  .map(c=>({n:c.dataset.name,t:+c.querySelector(".st").textContent}))
  .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);

 if(!d.length){
  winnerDiv.textContent="Noch keine Resultate";
  winnerDiv.className="winner winner-none";
  return;
 }
 winnerDiv.className="winner winner-ok";
 winnerDiv.textContent="🏆 Sieger: "+d[0].n+" ("+d[0].t+")";
}

/* ================= STATE ================= */
function saveAll(){
 [...groupsDiv.children].forEach(c=>{
  state[c.dataset.key]=[...c.querySelectorAll("tbody tr")].map(tr=>({
   n:tr.querySelector(".n").value,
   y:tr.querySelector(".y").value,
   s:tr.querySelector(".s").value,
   g:tr.querySelector(".g").value,
   r:tr.querySelector(".r").value
  }));
 });
}
function restore(c){
 const d=state[c.dataset.key];
 if(!d) return;
 c.querySelectorAll("tbody tr").forEach((tr,i)=>{
  if(!d[i]) return;
  tr.querySelector(".n").value=d[i].n;
  tr.querySelector(".y").value=d[i].y;
  tr.querySelector(".s").value=d[i].s;
  tr.querySelector(".g").value=d[i].g;
  tr.querySelector(".r").value=d[i].r;
 });
 calc(c);
}

/* ================= SEND ================= */
document.getElementById("sendBtn").onclick=()=>{
 alert("✅ Senden OK – Gruppen bleiben wählbar");
};

loadGroups();
</script>
</body>
</html>
