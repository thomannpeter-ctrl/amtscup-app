<!doctype html> 
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Amtscup – Cup-Duell</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0;color:#111827}
.container{max-width:1200px;margin:auto;padding:1rem}
h1{color:#1e3a8a}
h2{color:#1d4ed8;margin:.5rem 0}
.card{background:#fff;border-radius:14px;padding:1rem 1.25rem;
box-shadow:0 4px 10px rgba(15,23,42,.08);margin-bottom:1rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.field{flex:1;min-width:220px}
label{font-size:.8rem;font-weight:600}
input,select{width:100%;padding:.45rem;border-radius:8px;border:1px solid #cbd5f5}
.input-year{max-width:80px}
.input-result{max-width:70px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border:1px solid #e5e7eb;padding:.4rem;text-align:center}
th{background:#dbeafe}
button{border:none;border-radius:999px;padding:.9rem;font-size:1rem;
cursor:pointer;background:#2563eb;color:white;width:100%}
.winner{padding:.7rem;border-radius:12px;font-weight:700}
.winner-ok{background:#dcfce7;color:#166534}
.winner-none{background:#e5e7eb;color:#374151}
</style>
</head>

<body>
<div class="container">

<h1>Amtscup – Cup-Duell</h1>

<div class="card">
<h2>1. Gruppenchef</h2>
<div class="row">
  <div class="field"><label>Name</label><input id="chef"></div>
  <div class="field"><label>E-Mail</label><input id="email" type="email"></div>
</div>
</div>

<div class="card">
<h2>2. Gruppenauswahl</h2>
<div class="row">
  <div class="field"><label>Gruppe 1</label><select id="g1"></select></div>
  <div class="field"><label>Gruppe 2</label><select id="g2"></select></div>
  <div class="field"><label>Gruppe 3</label><select id="g3"></select></div>
</div>
</div>

<div id="groups"></div>

<div class="card">
<h2>Sieger</h2>
<div id="winner" class="winner winner-none">Noch keine Resultate</div>
</div>

<div class="card">
<button id="sendBtn">📧 Mail & Google senden</button>
</div>

</div>

<script>
const RESULT_EMAIL = "thomannpeter@bluewin.ch";
const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz1ZQO-T2JbllYVwwILeAS20iq0nFLGvdKcxgYz2_bs9TNmLmm5tQnfB9PfeTTBJ_oI/exec";

const SPORTGERAETE=[
 {n:"",z:0},{n:"Standard",z:0},{n:"FG",z:0},
 {n:"Karabiner",z:4},{n:"57/02",z:8},{n:"57/03",z:4},
 {n:"90BK",z:4},{n:"90RK",z:4}
];
const zus=g=>(SPORTGERAETE.find(x=>x.n===g)||{z:0}).z;

const elChef=chef, elEmail=email, elGroups=groups, elWinner=winner;
const elG=[g1,g2,g3];
sendBtn.onclick=sendAll;

const state={};

async function loadGroups(){
 const r=await fetch("gruppen.txt?"+Date.now());
 const list=(await r.text()).split(/\r?\n/).filter(Boolean);
 elG.forEach(s=>{
   s.innerHTML="<option value=''>Bitte wählen…</option>";
   list.forEach(g=>{
     const o=document.createElement("option");
     o.value=o.textContent=g;
     s.appendChild(o);
   });
   s.onchange=build;
 });
}

function build(){
 elG.forEach((s,i)=>{
  const existing=[...elGroups.children].find(c=>c.dataset.idx==i+1);

  if(s.value && !existing){
   const c=createGroup(i+1,s.value);
   elGroups.appendChild(c);
   restore(c);
  }

  if(!s.value && existing){
   save(existing);
   existing.remove();
  }
 });
 calcWinner();
}

function createGroup(i,name){
 const c=document.createElement("div");
 c.className="card"; c.dataset.idx=i; c.dataset.name=name;
 c.innerHTML=`<h2>Gruppe ${i}: ${name}</h2>
 <table><thead><tr>
 <th>#</th><th>Name</th><th>Jahrgang</th><th>Gender</th>
 <th>Sportgerät</th><th>Resultat</th><th>Zuschlag</th><th>Total</th>
 </tr></thead><tbody></tbody>
 <tfoot><tr><th colspan="5">Summe</th>
 <th class="sr">0</th><th class="sz">0</th><th class="st">0</th></tr></tfoot></table>`;
 const tb=c.querySelector("tbody");

 for(let n=1;n<=5;n++){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${n}</td>
   <td><input class="n"></td>
   <td><input class="y input-year"></td>
   <td><select class="sex"><option></option><option>m</option><option>w</option></select></td>
   <td><select class="g"></select></td>
   <td><input class="r input-result"></td>
   <td class="z">0</td><td class="t">0</td>`;
  SPORTGERAETE.forEach(s=>{
    const o=document.createElement("option");
    o.value=o.textContent=s.n;
    tr.querySelector(".g").appendChild(o);
  });
  tr.querySelectorAll("input,select").forEach(e=>e.oninput=()=>calc(c));
  tb.appendChild(tr);
 }
 return c;
}

function calc(c){
 let sr=0,sz=0,st=0;
 c.querySelectorAll("tbody tr").forEach(tr=>{
  const r=+tr.querySelector(".r").value||0;
  const z=zus(tr.querySelector(".g").value);
  tr.querySelector(".z").textContent=z;
  tr.querySelector(".t").textContent=r+z;
  sr+=r; sz+=z; st+=r+z;
 });
 c.querySelector(".sr").textContent=sr;
 c.querySelector(".sz").textContent=sz;
 c.querySelector(".st").textContent=st;
 calcWinner();
}

function calcWinner(){
 const d=[...elGroups.children]
  .map(c=>({n:c.dataset.name,t:+c.querySelector(".st").textContent}))
  .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);

 if(!d.length){ elWinner.textContent="Noch keine Resultate"; elWinner.className="winner winner-none"; return; }
 elWinner.className="winner winner-ok";
 elWinner.innerHTML=d.length===2
 ?`🏆 Sieger: ${d[0].n} (${d[0].t})<br>❌ Verlierer: ${d[1].n} (${d[1].t})`
 :`🏆 Sieger: ${d[0].n} (${d[0].t}) & ${d[1].n} (${d[1].t})<br>❌ Verlierer: ${d[2].n} (${d[2].t})`;
}

function save(c){
 state[c.dataset.idx]=[...c.querySelectorAll("tbody tr")].map(tr=>({
  n:tr.querySelector(".n").value,
  y:tr.querySelector(".y").value,
  s:tr.querySelector(".sex").value,
  g:tr.querySelector(".g").value,
  r:tr.querySelector(".r").value
 }));
}

function restore(c){
 const d=state[c.dataset.idx];
 if(!d) return;
 c.querySelectorAll("tbody tr").forEach((tr,i)=>{
  if(!d[i]) return;
  tr.querySelector(".n").value=d[i].n;
  tr.querySelector(".y").value=d[i].y;
  tr.querySelector(".sex").value=d[i].s;
  tr.querySelector(".g").value=d[i].g;
  tr.querySelector(".r").value=d[i].r;
 });
 calc(c);
}

function groupIsComplete(c){
 return [...c.querySelectorAll("tbody tr")].some(tr=>{
  return tr.querySelector(".n").value &&
         tr.querySelector(".y").value &&
         tr.querySelector(".sex").value &&
         tr.querySelector(".g").value &&
         tr.querySelector(".r").value;
 });
}

/* ===== SENDEN WIEDER KOMPLETT ===== */
function sendAll(){

 const ok=[...elGroups.children].some(c=>groupIsComplete(c));
 if(!ok){
  alert("❗ Mindestens eine Gruppe muss vollständig ausgefüllt sein.");
  return;
 }

 let mail=`AMTSCUP CUP-DUELL\n\nGruppenchef: ${elChef.value}\nE-Mail: ${elEmail.value}\n\n`;
 const rows=[];

 [...elGroups.children].forEach((c,i)=>{
  mail+=`GRUPPE ${i+1}: ${c.dataset.name}\n`;
  mail+="Name;Jahrgang;Gender;Sportgerät;Resultat;Zuschlag;Total\n";

  c.querySelectorAll("tbody tr").forEach(tr=>{
   const n=tr.querySelector(".n").value;
   const r=tr.querySelector(".r").value;
   if(!n&&!r) return;

   rows.push({
    gruppe:c.dataset.name,
    name:n,
    jahr:tr.querySelector(".y").value,
    gender:tr.querySelector(".sex").value,
    geraet:tr.querySelector(".g").value,
    resultat:r,
    zuschlag:tr.querySelector(".z").textContent,
    total:tr.querySelector(".t").textContent,
    gruppentotal:c.querySelector(".st").textContent
   });

   mail+=`${n};${tr.querySelector(".y").value};${tr.querySelector(".sex").value};${tr.querySelector(".g").value};${r};${tr.querySelector(".z").textContent};${tr.querySelector(".t").textContent}\n`;
  });

  mail+=`Summe;;;;${c.querySelector(".sr").textContent};${c.querySelector(".sz").textContent};${c.querySelector(".st").textContent}\n\n`;
 });

 mail+="SIEGER:\n"+elWinner.textContent;

 location.href=`mailto:${RESULT_EMAIL}?subject=${encodeURIComponent("Amtscup Resultat")}&body=${encodeURIComponent(mail)}`;

 fetch(GOOGLE_URL,{
  method:"POST",
  mode:"no-cors",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({chef:elChef.value,email:elEmail.value,rows})
 });

 alert("✅ Resultate erfolgreich übermittelt");
}

loadGroups();
</script>
</body>
</html>
