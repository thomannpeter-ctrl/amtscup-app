<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Amtscup – Cup-Duell</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0}
.container{max-width:1200px;margin:auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border:1px solid #ccc;padding:.4rem;text-align:center}
th{background:#dbeafe}
input,select{width:100%}
button{padding:1rem;width:100%;font-size:1rem}
</style>
</head>

<body>
<div class="container">

<h1>Amtscup – Cup-Duell</h1>

<div class="card">
<label>Gruppenchef</label><input id="chef">
<label>E-Mail</label><input id="email">
</div>

<div class="card">
<label>Gruppe</label>
<select id="gruppe"></select>
</div>

<div id="block"></div>

<div class="card">
<button onclick="sendResult()">📧 Mail & Google senden</button>
</div>

</div>

<script>
const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbz1YSiGxzltZwPwgdIlPXKQeAHT-8UponjHP8pC5nqJ-T8CeGKTcAJ0RpBuV_61e4Qs/exec";
const RESULT_EMAIL = "thomannpeter@bluewin.ch";

async function loadGroups(){
 const r=await fetch("gruppen.txt");
 const list=(await r.text()).split(/\r?\n/).filter(x=>x);
 const s=document.getElementById("gruppe");
 s.innerHTML="<option></option>";
 list.forEach(g=>{
  const o=document.createElement("option");
  o.textContent=o.value=g;
  s.appendChild(o);
 });
 s.onchange=build;
}

function build(){
 block.innerHTML="";
 const name=gruppe.value;
 if(!name) return;
 block.innerHTML=`<div class="card"><h2>${name}</h2>
 <table><thead>
 <tr><th>#</th><th>Name</th><th>Jahrgang</th><th>Gender</th><th>Sportgerät</th><th>Resultat</th></tr>
 </thead><tbody id="tb"></tbody></table></div>`;
 for(let i=1;i<=5;i++){
  tb.innerHTML+=`<tr>
   <td>${i}</td>
   <td><input class="n"></td>
   <td><input class="y"></td>
   <td>
    <select class="g"><option></option><option>m</option><option>w</option></select>
   </td>
   <td><input class="s"></td>
   <td><input class="r"></td>
  </tr>`;
 }
}

function sendResult(){
 let mail="AMTSCUP RESULTAT\n\n";
 let rows=[];
 document.querySelectorAll("#tb tr").forEach((tr,i)=>{
  const n=tr.querySelector(".n").value;
  if(!n) return;
  const y=tr.querySelector(".y").value;
  const g=tr.querySelector(".g").value;
  const s=tr.querySelector(".s").value;
  const r=tr.querySelector(".r").value;
  const row=[
   new Date().toLocaleDateString(),
   "Amtscup",
   "",
   1,
   "",
   "",
   gruppe.value,
   i+1,
   n,y,g,s,r,0,r
  ];
  rows.push(row);
  mail+=`${n};${y};${g};${s};${r}\n`;
 });

 fetch(GOOGLE_URL,{
  method:"POST",
  body:JSON.stringify({rows}),
  headers:{"Content-Type":"application/json"}
 });

 location.href=`mailto:${RESULT_EMAIL}?subject=Amtscup Resultat&body=${encodeURIComponent(mail)}`;
}

loadGroups();
</script>
</body>
</html>
